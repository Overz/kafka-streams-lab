# Spring Cloud Config Server -- a unica fonte de configuracao das apps Streams.
#
# As apps rodam no HOST (decisao D6 do desenho de infra) e consultam localhost:8888
# durante o boot. Sem este servico de pe, nem orders nem antifraud sobem: configuracao
# incompleta derruba o processo em vez de deixar a topologia rodar pela metade.
#
# Backend "native": as propriedades sao os .yaml de ./repository, montados read-only em
# /config. Trocar um limiar de regra de fraude e editar o arquivo e reiniciar a app --
# sem rebuild de imagem, sem recompilar Java.
#
#   curl -s localhost:8888/lab/orders | jq .
#   curl -s localhost:8888/lab/antifraud | jq .
#
# A forma longa continua valendo quando o profile importa:
#   curl -s localhost:8888/lab/orders/prod | jq .
#
# Tambem cria os topicos, no proprio boot, a partir de src/main/resources/kafka/*.yaml --
# um arquivo por dominio, cada um apontando para o cluster dele. Substituiu o job
# kafka-init-topics e o create-topics.sh. So cria: topico existente e ignorado.
#
# Sem depends_on nos brokers de proposito. Servir configuracao nao pode depender do Kafka
# estar de pe -- as apps nem sobem sem este servico. O provisionamento espera o cluster
# com backoff (lab.kafka.topics.attempts x backoff) e desiste no log se ele nunca subir,
# enquanto a 8888 ja responde desde o inicio.
#
#   docker compose restart config-server     # reprovisiona (ou: make topics)
#
# Fica nas duas redes porque nao pertence a cluster nenhum: os dois dominios o consultam,
# e e delas que ele alcanca os brokers dos dois lados para criar os topicos.
networks:
  cluster-a:
    name: "cluster-a"
  cluster-b:
    name: "cluster-b"

services:
  config-server:
    build:
      # Raiz do projeto: o Dockerfile precisa do pom agregador para resolver o parent.
      context: ".."
      dockerfile: "config-server/Dockerfile"
    image: "kafka-streams-lab/config-server:0.0.1"
    container_name: "config-server"
    restart: "always"
    ports:
      - "8888:8888"
    environment:
      # Nivel do log, resolvido em application.yaml. Mesmo nome e default da API e das
      # apps Streams: LOG_LEVEL=info docker compose up -d config-server
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
    volumes:
      - "./repository:/config:ro"
    # TCP puro com o /dev/tcp do bash, mesmo padrao dos brokers e do MM2: nao depende de
    # curl estar na imagem base. A 8888 so passa a escutar depois que o contexto Spring
    # subiu inteiro, entao o socket aberto ja implica backend native carregado.
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8888" ]
      interval: "10s"
      timeout: "5s"
      retries: 12
      start_period: "40s"
    deploy:
      resources:
        reservations: { cpus: "0.1", memory: "128M" }
        limits: { cpus: "0.5", memory: "512M" }
    # O driver json-file grava o valor destes labels em cada linha do log ("attrs"),
    # que e como o receiver filelog do otelcol descobre de qual servico o log veio.
    logging:
      driver: "json-file"
      options:
        labels: "com.docker.compose.service"
    networks:
      - "cluster-a"
      - "cluster-b"
