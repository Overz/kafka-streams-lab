# MirrorMaker 2 em dedicated mode.
#
# MM2 nao e feature do broker nem plugin: e um processo Java que consome de um
# cluster como consumer comum e produz no outro como producer comum. Consequencia
# direta: NAO existe transacao atravessando os dois clusters, logo a replicacao e
# at-least-once e duplicatas cruzam a fronteira. E por isso que a regra de
# idempotencia por orderId ("Kafka Streams Lab.md", secao 13) e obrigatoria aqui.
#
# As duas instancias sobem com ESTE MESMO arquivo e formam um cluster entre si,
# dividindo as tasks. Se uma morre, a outra assume (exercicio 6).

clusters = cluster-a, cluster-b

# Enderecos internos (:9092), nao os EXTERNAL -- o MM2 roda em container, dentro
# das duas redes docker.
cluster-a.bootstrap.servers = kafka-broker-a-1:9092,kafka-broker-a-2:9092,kafka-broker-a-3:9092
cluster-b.bootstrap.servers = kafka-broker-b-1:9092,kafka-broker-b-2:9092,kafka-broker-b-3:9092

# --- Fluxos ---------------------------------------------------------------
# Cada dominio produz no seu cluster local; so o topico de CONTRATO atravessa.
# A->B: o pedido que precisa de analise de risco.
# B->A: a decisao do antifraude.
cluster-a->cluster-b.enabled = true
cluster-a->cluster-b.topics  = orders\.fraud-requested

cluster-b->cluster-a.enabled = true
cluster-b->cluster-a.topics  = antifraud\.analysis-completed

# --- Politica de nomes ----------------------------------------------------
# DefaultReplicationPolicy renomeia o topico replicado para
# <cluster-de-origem>.<nome>, entao o antifraud consome
# "cluster-a.orders.fraud-requested" e o orders consome
# "cluster-b.antifraud.analysis-completed".
#
# O prefixo tambem e o que da protecao contra ciclo: o MM2 usa topicSource() da
# policy para reconhecer um topico que ja e replica e nao manda de volta.
# IdentityReplicationPolicy mantem o nome original mas devolve null nesse metodo,
# derrubando a protecao por completo. Com os filtros estreitos e disjuntos acima
# nao haveria ciclo mesmo assim -- mas o dia em que um filtro virar "orders\..*",
# a rede de seguranca deixa de existir.
replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy

# 1 task por particao. Com o default (1), uma das duas instancias ficaria ociosa
# e a HA da camada de replicacao nao seria observavel.
tasks.max = 3

# --- Replicacao dos topicos internos do proprio MM2 -----------------------
# Sem isto tudo em 3, os topicos de controle do MM2 nasceriam com RF=1 e viriam
# a ser o ponto unico de falha de um lab inteiro montado para nao ter nenhum.
replication.factor                    = 3
checkpoints.topic.replication.factor  = 3
heartbeats.topic.replication.factor   = 3
offset-syncs.topic.replication.factor = 3
offset.storage.replication.factor     = 3
status.storage.replication.factor     = 3
config.storage.replication.factor     = 3

# --- Comportamento --------------------------------------------------------
sync.topic.configs.enabled      = true
# Emite checkpoints traduzindo offsets de consumer group entre os clusters.
# Offset 42 em A nao e offset 42 em B. Irrelevante no fluxo normal, essencial
# em failover.
sync.group.offsets.enabled      = true
emit.checkpoints.enabled        = true
emit.heartbeats.enabled         = true
refresh.topics.interval.seconds = 10

# --- REST interno (KIP-710) -----------------------------------------------
# Obrigatorio para rodar MAIS DE UMA instancia em dedicated mode: os workers
# seguidores encaminham mudanca de config para o lider por este canal. Sem isto,
# a segunda instancia falha ao propagar configuracao.
# O host anunciado e o hostname do container, que coincide com o service name --
# por isso resolve por DNS na rede docker.
dedicated.mode.enable.internal.rest = true
listeners = http://0.0.0.0:8083
