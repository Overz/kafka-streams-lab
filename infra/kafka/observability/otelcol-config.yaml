# Config do OTel Collector embutido no grafana/otel-lgtm -- baseada na config padrao
# da imagem (grafana/docker-otel-lgtm, docker/otelcol-config.yaml), com os scrape jobs
# do Kafka acrescentados ao receiver "prometheus/collector".
# Montada em /otel-lgtm/otelcol-config.yaml (ver observability.yaml).
#
# Os 14 alvos expoem /metrics na 7071 via jmx_prometheus_javaagent (ver Dockerfile).
# O label "cluster" e o que permite comparar os dois clusters no mesmo painel.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]

        - job_name: "kafka-cluster-a"
          scrape_interval: 15s
          static_configs:
            - targets:
                - "kafka-controller-a-1:7071"
                - "kafka-controller-a-2:7071"
                - "kafka-controller-a-3:7071"
              labels: { cluster: "cluster-a", role: "controller" }
            - targets:
                - "kafka-broker-a-1:7071"
                - "kafka-broker-a-2:7071"
                - "kafka-broker-a-3:7071"
              labels: { cluster: "cluster-a", role: "broker" }

        - job_name: "kafka-cluster-b"
          scrape_interval: 15s
          static_configs:
            - targets:
                - "kafka-controller-b-1:7071"
                - "kafka-controller-b-2:7071"
                - "kafka-controller-b-3:7071"
              labels: { cluster: "cluster-b", role: "controller" }
            - targets:
                - "kafka-broker-b-1:7071"
                - "kafka-broker-b-2:7071"
                - "kafka-broker-b-3:7071"
              labels: { cluster: "cluster-b", role: "broker" }

        - job_name: "kafka-mirror"
          scrape_interval: 15s
          static_configs:
            - targets:
                - "kafka-mirror-1:7071"
                - "kafka-mirror-2:7071"
              labels: { role: "mirror" }

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/traces]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [batch]
      exporters: [otlp_http/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]
