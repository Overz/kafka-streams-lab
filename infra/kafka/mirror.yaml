# MirrorMaker 2 -- a unica ponte de DADOS entre os dois clusters.
#
# Duas instancias com o mesmo mm2.properties: elas formam um cluster Connect e
# dividem as tasks. Matar uma e o exercicio 6.
#
# Incluido pelo compose.yaml da raiz. Como tudo vira um projeto so, o MM2 pode
# declarar depends_on nos brokers dos DOIS clusters e esperar ambos ficarem
# healthy -- sem isso ele sobe antes e fica em crash loop ate os clusters
# responderem.
networks:
  cluster-a:
    name: "cluster-a"
  cluster-b:
    name: "cluster-b"

x-mirror-commons: &mirror-commons
  image: "kafka-streams-lab/kafka:4.1.1"
  restart: "always"
  networks:
    - "cluster-a"
    - "cluster-b"
  volumes:
    - "./mirror/mm2.properties:/opt/kafka/config/mm2.properties:ro"
  # O ENTRYPOINT da imagem (/__cacert_entrypoint.sh) faz exec no CMD, entao trocar
  # so o command basta para rodar MM2 em vez do broker. O wrapper with-jmx.sh
  # continua no caminho para o agent entrar so neste processo.
  command:
    - "/opt/jmx/with-jmx.sh"
    - "/opt/kafka/bin/connect-mirror-maker.sh"
    - "/opt/kafka/config/mm2.properties"
  environment:
    KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
  deploy:
    resources:
      reservations: { cpus: "0.25", memory: "512M" }
      limits: { cpus: "1.0", memory: "1G" }
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8083"]
    interval: "15s"
    timeout: "5s"
    retries: 20
    start_period: "40s"
  # Espera os dois clusters, nao um. O MM2 abre consumer em A e producer em B (e
  # o inverso) na largada: subir com um dos lados fora so gera crash loop.
  depends_on:
    kafka-broker-a-1: { condition: "service_healthy" }
    kafka-broker-a-2: { condition: "service_healthy" }
    kafka-broker-a-3: { condition: "service_healthy" }
    kafka-broker-b-1: { condition: "service_healthy" }
    kafka-broker-b-2: { condition: "service_healthy" }
    kafka-broker-b-3: { condition: "service_healthy" }

services:
  # hostname explicito e igual ao service name: o REST interno do KIP-710 anuncia
  # o hostname do container, e o alias de DNS na rede e o service name. Se os dois
  # divergissem, um worker nao acharia o outro.
  kafka-mirror-1:
    <<: *mirror-commons
    container_name: "kafka-mirror-1"
    hostname: "kafka-mirror-1"

  kafka-mirror-2:
    <<: *mirror-commons
    container_name: "kafka-mirror-2"
    hostname: "kafka-mirror-2"
