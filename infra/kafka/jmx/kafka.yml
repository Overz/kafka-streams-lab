lowercaseOutputName: true

rules:
# Taxa de 15 minutos de BrokerTopicMetrics, no formato que o kafbat espera:
# nome contendo "BrokerTopicMetrics", terminando em "FifteenMinuteRate", e o
# nome da metrica JMX vindo como LABEL (name="BytesInPerSec"). Sem estas duas
# regras as colunas de throughput do kafbat ficam vazias -- o resto do arquivo so
# exporta o atributo Count ("...PerSec...><>Count"), que e contador acumulado, e
# nenhuma regra casa com <>FifteenMinuteRate.
# Vem primeiro porque a primeira regra que casa vence.
- pattern: kafka.server<type=BrokerTopicMetrics, name=(.+), topic=(.+)><>FifteenMinuteRate
  name: kafka_server_BrokerTopicMetrics_FifteenMinuteRate
  type: GAUGE
  labels:
    name: "$1"
    topic: "$2"
- pattern: kafka.server<type=BrokerTopicMetrics, name=(.+)><>FifteenMinuteRate
  name: kafka_server_BrokerTopicMetrics_FifteenMinuteRate
  type: GAUGE
  labels:
    name: "$1"

# Special cases and very specific rules
- pattern : kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
  name: kafka_server_$1_$2
  type: GAUGE
  labels:
    clientId: "$3"
    topic: "$4"
    partition: "$5"
- pattern : kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value
  name: kafka_server_$1_$2
  type: GAUGE
  labels:
    clientId: "$3"
    broker: "$4:$5"
- pattern : kafka.coordinator.(\w+)<type=(.+), name=(.+)><>Value
  name: kafka_coordinator_$1_$2_$3
  type: GAUGE

# Generic per-second counters with 0-2 key/value pairs
- pattern: kafka.(\w+)<type=(.+), name=(.+)PerSec\w*, (.+)=(.+), (.+)=(.+)><>Count
  name: kafka_$1_$2_$3_total
  type: COUNTER
  labels:
    "$4": "$5"
    "$6": "$7"
- pattern: kafka.(\w+)<type=(.+), name=(.+)PerSec\w*, (.+)=(.+)><>Count
  name: kafka_$1_$2_$3_total
  type: COUNTER
  labels:
    "$4": "$5"
- pattern: kafka.(\w+)<type=(.+), name=(.+)PerSec\w*><>Count
  name: kafka_$1_$2_$3_total
  type: COUNTER

# Quota specific rules
- pattern: kafka.server<type=(.+), user=(.+), client-id=(.+)><>([a-z-]+)
  name: kafka_server_quota_$4
  type: GAUGE
  labels:
    resource: "$1"
    user: "$2"
    clientId: "$3"
- pattern: kafka.server<type=(.+), client-id=(.+)><>([a-z-]+)
  name: kafka_server_quota_$3
  type: GAUGE
  labels:
    resource: "$1"
    clientId: "$2"
- pattern: kafka.server<type=(.+), user=(.+)><>([a-z-]+)
  name: kafka_server_quota_$3
  type: GAUGE
  labels:
    resource: "$1"
    user: "$2"

# Generic gauges with 0-2 key/value pairs
- pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+), (.+)=(.+)><>Value
  name: kafka_$1_$2_$3
  type: GAUGE
  labels:
    "$4": "$5"
    "$6": "$7"
- pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+)><>Value
  name: kafka_$1_$2_$3
  type: GAUGE
  labels:
    "$4": "$5"
- pattern: kafka.(\w+)<type=(.+), name=(.+)><>Value
  name: kafka_$1_$2_$3
  type: GAUGE

# Emulate Prometheus 'Summary' metrics for the exported 'Histogram's.
#
# Note that these are missing the '_sum' metric!
- pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+), (.+)=(.+)><>Count
  name: kafka_$1_$2_$3_count
  type: COUNTER
  labels:
    "$4": "$5"
    "$6": "$7"
- pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.*), (.+)=(.+)><>(\d+)thPercentile
  name: kafka_$1_$2_$3
  type: GAUGE
  labels:
    "$4": "$5"
    "$6": "$7"
    quantile: "0.$8"
- pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+)><>Count
  name: kafka_$1_$2_$3_count
  type: COUNTER
  labels:
    "$4": "$5"
- pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.*)><>(\d+)thPercentile
  name: kafka_$1_$2_$3
  type: GAUGE
  labels:
    "$4": "$5"
    quantile: "0.$6"
- pattern: kafka.(\w+)<type=(.+), name=(.+)><>Count
  name: kafka_$1_$2_$3_count
  type: COUNTER
- pattern: kafka.(\w+)<type=(.+), name=(.+)><>(\d+)thPercentile
  name: kafka_$1_$2_$3
  type: GAUGE
  labels:
    quantile: "0.$4"

# Generic gauges for MeanRate Percent
# Ex) kafka.server<type=KafkaRequestHandlerPool, name=RequestHandlerAvgIdlePercent><>MeanRate
- pattern: kafka.(\w+)<type=(.+), name=(.+)Percent\w*><>MeanRate
  name: kafka_$1_$2_$3_percent
  type: GAUGE
- pattern: kafka.(\w+)<type=(.+), name=(.+)Percent\w*><>Value
  name: kafka_$1_$2_$3_percent
  type: GAUGE
- pattern: kafka.(\w+)<type=(.+), name=(.+)Percent\w*, (.+)=(.+)><>Value
  name: kafka_$1_$2_$3_percent
  type: GAUGE
  labels:
    "$4": "$5"

# ---------------------------------------------------------------------------
# Regras acrescentadas ao exemplo canonico: MirrorMaker 2 e os clientes internos
# do Connect. Sem elas, o /metrics dos containers kafka-mirror-* vem praticamente
# vazio -- o exemplo upstream so cobre o dominio kafka.* do broker.
# O exporter troca caractere invalido por "_", entao "replication-latency-ms-avg"
# vira "replication_latency_ms_avg" no nome final.
# ---------------------------------------------------------------------------

# MirrorSourceConnector por particao replicada: replication-latency-ms, record-age-ms,
# byte-rate, record-count. E a latencia A->B que os exercicios medem.
- pattern: kafka.connect.mirror<type=(.+), target=(.+), topic=(.+), partition=(.+)><>([a-z][a-z0-9-]*)
  name: kafka_connect_mirror_$1_$5
  type: GAUGE
  labels:
    target: "$2"
    topic: "$3"
    partition: "$4"
- pattern: kafka.connect.mirror<type=(.+), (.+)=(.+)><>([a-z][a-z0-9-]*)
  name: kafka_connect_mirror_$1_$4
  type: GAUGE
  labels:
    "$2": "$3"

# Worker e tasks do Connect: e aqui que se ve uma instancia do MM2 assumir as
# tasks da outra quando ela morre (exercicio 6).
- pattern: kafka.connect<type=connect-worker-metrics, connector=(.+)><>([a-z][a-z0-9-]*)
  name: kafka_connect_worker_$2
  type: GAUGE
  labels:
    connector: "$1"
- pattern: kafka.connect<type=connect-worker-metrics><>([a-z][a-z0-9-]*)
  name: kafka_connect_worker_$1
  type: GAUGE
- pattern: kafka.connect<type=connector-task-metrics, connector=(.+), task=(.+)><>([a-z][a-z0-9-]*)
  name: kafka_connect_task_$3
  type: GAUGE
  labels:
    connector: "$1"
    task: "$2"
- pattern: kafka.connect<type=(.+), (.+)=(.+)><>([a-z][a-z0-9-]*)
  name: kafka_connect_$1_$4
  type: GAUGE
  labels:
    "$2": "$3"

# Consumer interno do MM2: records-lag-max por particao e o RPO quando um cluster
# esta fora do ar (exercicio 5).
- pattern: kafka.consumer<type=consumer-fetch-manager-metrics, client-id=(.+), topic=(.+), partition=(.+)><>([a-z][a-z0-9-]*)
  name: kafka_consumer_fetch_manager_$4
  type: GAUGE
  labels:
    client_id: "$1"
    topic: "$2"
    partition: "$3"
- pattern: kafka.consumer<type=(.+), client-id=(.+)><>([a-z][a-z0-9-]*)
  name: kafka_consumer_$1_$3
  type: GAUGE
  labels:
    client_id: "$2"
- pattern: kafka.producer<type=(.+), client-id=(.+)><>([a-z][a-z0-9-]*)
  name: kafka_producer_$1_$3
  type: GAUGE
  labels:
    client_id: "$2"
