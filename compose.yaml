# Ponto de entrada da infraestrutura do lab.
#
#   docker compose up -d --wait
#
# Os quatro arquivos incluidos ficam em infra/kafka/ e continuam legiveis
# isolados: abrir cluster-a.yaml mostra um cluster, nao os 16 servicos
# intercalados. O "include" junta todos num unico projeto compose, o que tambem
# permite ao MirrorMaker 2 declarar depends_on nos brokers dos dois clusters --
# com projetos separados isso nao seria possivel.
#
# Desenho e justificativas: docs/superpowers/specs/2026-08-07-kafka-multi-cluster-ha-design.md
# Como usar e exercicios de falha: infra/kafka/README.md
name: "kafka-streams-lab"

include:
  # Cluster A -- dominio orders. 3 controllers + 3 brokers, rede cluster-a.
  - "infra/kafka/cluster-a.yaml"
  # Cluster B -- dominio antifraud. Mesma forma, rede cluster-b.
  - "infra/kafka/cluster-b.yaml"
  # A unica ponte de dados entre os dois: 2 instancias de MirrorMaker 2.
  - "infra/kafka/mirror.yaml"
  # kafbat (estado atual) e grafana-lgtm (historico). Sobe junto; para deixar de
  # fora, use "docker compose stop kafbat grafana-lgtm" ou "make observability-down".
  - "infra/kafka/observability.yaml"
