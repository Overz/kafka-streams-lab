  design:
    - Escreva em portugues do Brasil.
    - Inclua uma tabela de decisoes com a coluna "Alternativas descartadas", no mesmo
      formato de docs/superpowers/specs/2026-08-07-kafka-multi-cluster-ha-design.md.
    - Registre qual conceito de Kafka Streams cada decisao exercita.
  specs:
    - Escreva em portugues do Brasil.
    - Cada cenario deve ser verificavel por um teste automatizado concreto.
    - Cenarios de topologia devem nomear o topico de entrada e o de saida.
  tasks:
    - Escreva em portugues do Brasil.
    - "O teste sempre vem antes da implementacao: a task do teste precede a task do codigo."
    - Cada grupo de tasks termina com uma task de verificacao executavel.
