# Ponto de entrada da infraestrutura do lab.
#
#   docker compose up -d --wait     sobe tudo, constroi as imagens e cria os topicos
#   docker compose down             para tudo, preserva os volumes
#   docker compose down -v          apaga volumes e redes tambem
#
# O Makefile e so atalho: nada aqui depende dele.
#
# Um arquivo por dominio, cada um na propria pasta com o que so ele usa (config,
# Dockerfile, scripts). Abrir infra/kafka/cluster-a.yaml mostra um cluster, nao
# os 21 servicos intercalados. O "include" junta todos num unico projeto compose,
# o que tambem permite ao MirrorMaker 2 declarar depends_on nos brokers dos dois
# clusters -- com projetos separados isso nao seria possivel.
#
# Desenho e justificativas: docs/superpowers/specs/2026-08-07-kafka-multi-cluster-ha-design.md
# Como usar e exercicios de falha: infra/README.md
name: "kafka-streams-lab"

include:
  # --- Configuracao ---------------------------------------------------------
  # Spring Cloud Config Server. As apps Streams rodam no host e consultam a 8888 no
  # boot; sem ele elas nao sobem. Nao pertence a cluster nenhum, fica nas duas redes.
  # E tambem quem cria os topicos, no proprio boot, a partir de resources/kafka/*.yaml.
  - "config-server/compose.yaml"

  # --- Kafka ---------------------------------------------------------------
  # Cluster A -- dominio orders. 3 controllers + 3 brokers, rede cluster-a.
  - "infra/kafka/cluster-a.yaml"
  # Cluster B -- dominio antifraud. Mesma forma, rede cluster-b.
  - "infra/kafka/cluster-b.yaml"

  # A unica ponte de dados entre os clusters: 2 instancias de MirrorMaker 2.
  - "infra/mirrormaker/compose.yaml"

  # --- Entrada ---------------------------------------------------------------
  # API HTTP em Go, o unico produtor de orders.created que nao e Kafka Streams.
  # Roda no compose (nao tem topologia para reescrever) e so fala com o cluster A.
  - "api/compose.yaml"

  # --- Estado agora --------------------------------------------------------
  # UI dos clusters, com login OAuth2 e MCP.
  - "infra/kafbat/compose.yaml"
  # IdP local, serve o kafbat e o OpenObserve.
  - "infra/dex/compose.yaml"

  # --- Historico -----------------------------------------------------------
  # Onde metrica, log e trace ficam guardados.
  - "infra/openobserve/compose.yaml"
  # Quem coleta e entrega ao OpenObserve.
  - "infra/otelcol/compose.yaml"

  # --- SQL sobre os topicos ------------------------------------------------
  # Flink: SQL continuo, sem passar pelo MM2.
  - "infra/flink/compose.yaml"
